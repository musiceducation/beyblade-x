<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>咩咩遊樂園 — 手機鏡頭</title>
  <script>
    (function () {
      if (location.protocol === 'http:') {
        location.replace(
          'https://' + location.hostname + ':8443' + location.pathname + location.search
        );
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: #0a0e17;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      gap: 1rem;
    }
    h1 { font-size: 1.05rem; letter-spacing: 0.05em; text-align: center; }
    .status {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      color: #8892a8;
      min-height: 2.5em;
      max-width: 420px;
      line-height: 1.45;
    }
    .status.ok { color: #00d4ff; }
    .status.err { color: #ff2d55; }
    .status.wait { color: #ffd60a; }
    .secure-warn {
      background: rgba(255, 45, 85, 0.12);
      border: 1px solid #ff2d55;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 0.85rem;
      max-width: 420px;
      line-height: 1.5;
      color: #ffb3c0;
    }
    .secure-warn strong { color: #ff2d55; }
    .secure-warn code { background: rgba(0,0,0,0.3); padding: 0.1rem 0.35rem; border-radius: 4px; }
    video {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      background: #000;
      aspect-ratio: 4/3;
      object-fit: cover;
    }
    video.mirrored { transform: scaleX(-1); }
    video.hidden-preview { opacity: 0.35; }
    .btn {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff2d55, #cc0033);
      color: #fff;
      cursor: pointer;
      width: 100%;
      max-width: 480px;
    }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-link {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 0.75rem;
      background: linear-gradient(135deg, #00d4ff, #0088cc);
    }
    .hint { font-size: 0.78rem; color: #8892a8; text-align: center; max-width: 420px; line-height: 1.5; }
    .room { color: #ffd60a; font-size: 1.15rem; letter-spacing: 0.12em; }
    .connected-badge {
      display: none;
      font-size: 0.9rem;
      color: #00d4ff;
      font-weight: 700;
    }
    .connected-badge.show { display: block; }
  </style>
</head>
<body>
  <h1>📷 手機鏡頭 → 競賽主機</h1>
  <p class="status wait" id="status">正在連線…</p>
  <div id="secure-warn" class="secure-warn" hidden></div>
  <p>房間 <span class="room" id="room-display">—</span></p>
  <p class="connected-badge" id="connected-badge">✓ 已連線 · 可固定手機於戰盤上方</p>
  <video id="preview" class="hidden-preview" autoplay playsinline muted></video>
  <button id="btn-retry" class="btn" hidden disabled>重試連線</button>
  <p class="hint" id="hint">掃 QR 後會自動開啟鏡頭並連線，請允許相機權限</p>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const PEER_CONFIG = {
      debug: 0,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
        ],
      },
    };
    const MAX_CALL_RETRIES = 60;
    const CALL_RETRY_MS = 1200;
    const AUTO_START_DELAY_MS = 400;

    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || '').trim().toUpperCase();
    const hostId = room ? `bex-${room}` : null;
    const statusEl = document.getElementById('status');
    const secureWarn = document.getElementById('secure-warn');
    const preview = document.getElementById('preview');
    const retryBtn = document.getElementById('btn-retry');
    const connectedBadge = document.getElementById('connected-badge');
    let localStream = null;
    let peer = null;
    let activeCall = null;
    let connected = false;
    let retryTimer = null;
    let dialAttempt = 0;
    let starting = false;

    function isRetriablePeerError(err) {
      const msg = String((err && err.message) || (err && err.type) || err || '');
      return err.type === 'peer-unavailable'
        || err.type === 'network'
        || err.type === 'server-error'
        || /could not connect to peer/i.test(msg);
    }

    document.getElementById('room-display').textContent = room || '—';

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function showRetry(msg) {
      setStatus(msg, 'err');
      retryBtn.hidden = false;
      retryBtn.disabled = false;
      retryBtn.textContent = '重試連線';
    }

    function cleanup() {
      if (retryTimer) clearTimeout(retryTimer);
      retryTimer = null;
      if (activeCall) {
        activeCall.close();
        activeCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      connected = false;
      connectedBadge.classList.remove('show');
      preview.classList.add('hidden-preview');
    }

    function getCameraErrorMessage() {
      if (!window.isSecureContext) {
        const host = location.hostname;
        const httpsUrl = `https://${host}:8443${location.pathname}${location.search}`;
        secureWarn.hidden = false;
        secureWarn.innerHTML =
          '<strong>需要 HTTPS 才能開鏡頭</strong><br><br>' +
          '請確認主機已執行 <code>./start.sh</code>';
        const link = document.createElement('a');
        link.href = httpsUrl;
        link.className = 'btn btn-link';
        link.textContent = '👉 點此改用 HTTPS 開啟';
        link.style.maxWidth = '420px';
        secureWarn.appendChild(document.createElement('br'));
        secureWarn.appendChild(link);
        const note = document.createElement('p');
        note.style.marginTop = '0.75rem';
        note.style.fontSize = '0.78rem';
        note.innerHTML = '首次需：顯示詳細資料 → 瀏覽此網站（接受憑證）';
        secureWarn.appendChild(note);
        return '正在跳轉 HTTPS…';
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return '此瀏覽器不支援相機，請用 Safari 或 Chrome';
      }
      return null;
    }

    const camBlock = getCameraErrorMessage();

    function onPhoneConnected() {
      if (connected) return;
      connected = true;
      starting = false;
      if (retryTimer) clearTimeout(retryTimer);
      setStatus('已連線！', 'ok');
      connectedBadge.classList.add('show');
      preview.classList.remove('hidden-preview');
      retryBtn.hidden = true;
      document.getElementById('hint').textContent = '保持此頁開啟，畫面會傳到主機';
    }

    function watchCallState(call, attempt) {
      const pc = call.peerConnection;
      if (!pc) {
        setTimeout(() => { if (!connected) onPhoneConnected(); }, 1200);
        return;
      }
      pc.addEventListener('connectionstatechange', () => {
        const s = pc.connectionState;
        if (s === 'connected') onPhoneConnected();
        if ((s === 'failed' || s === 'disconnected') && connected) {
          connected = false;
          starting = false;
          showRetry('與主機連線中斷');
        }
        if (s === 'failed' && !connected) scheduleRetry(attempt);
      });
      pc.addEventListener('iceconnectionstatechange', () => {
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          onPhoneConnected();
        }
      });
    }

    function scheduleRetry(attempt) {
      if (connected) return;
      dialAttempt = attempt;
      if (attempt >= MAX_CALL_RETRIES) {
        starting = false;
        showRetry('無法連線主機。請確認主機已選「手機/平板」且房間碼為 ' + room);
        return;
      }
      setStatus(`等待主機就緒… ${attempt + 1}/${MAX_CALL_RETRIES}`, 'wait');
      retryTimer = setTimeout(() => dialHost(attempt + 1), CALL_RETRY_MS);
    }

    function dialHost(attempt) {
      if (!peer || !localStream || connected) return;
      dialAttempt = attempt;
      if (activeCall) {
        activeCall.close();
        activeCall = null;
      }

      if (attempt === 0) setStatus('正在連線主機…', 'wait');
      else setStatus(`等待主機就緒… ${attempt + 1}/${MAX_CALL_RETRIES}`, 'wait');

      activeCall = peer.call(hostId, localStream);
      if (!activeCall) {
        scheduleRetry(attempt);
        return;
      }

      activeCall.on('error', (err) => {
        if (!connected && isRetriablePeerError(err)) scheduleRetry(attempt);
        else if (!connected) {
          starting = false;
          showRetry('連線錯誤：' + (err.message || err.type || 'unknown'));
        }
      });
      activeCall.on('close', () => {
        if (connected) {
          connected = false;
          starting = false;
          showRetry('連線已關閉');
        }
      });
      watchCallState(activeCall, attempt);
    }

    async function startConnection() {
      if (!hostId || camBlock || connected || starting) return;

      starting = true;
      retryBtn.hidden = true;
      retryBtn.disabled = true;
      cleanup();
      starting = true;

      try {
        setStatus('正在開啟鏡頭…', 'wait');
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        preview.srcObject = localStream;
        preview.classList.add('mirrored');

        peer = new Peer(undefined, PEER_CONFIG);

        peer.on('open', () => dialHost(0));

        peer.on('error', (err) => {
          console.error(err);
          if (!connected && isRetriablePeerError(err)) {
            scheduleRetry(dialAttempt);
            return;
          }
          starting = false;
          showRetry('Peer 錯誤：' + (err.message || err.type));
        });

        peer.on('disconnected', () => {
          if (!connected) setStatus('網路斷線，正在重連…', 'wait');
          peer.reconnect();
        });
      } catch (err) {
        console.error(err);
        cleanup();
        starting = false;
        if (err.name === 'NotAllowedError') {
          showRetry('請允許相機權限後重試');
        } else {
          showRetry('無法開啟鏡頭：' + (err.message || '請檢查權限'));
        }
      }
    }

    retryBtn.addEventListener('click', () => startConnection());

    window.addEventListener('beforeunload', cleanup);

    if (camBlock) {
      setStatus(camBlock, 'err');
    } else if (!hostId) {
      setStatus('連結無效，請從主機掃描 QR', 'err');
    } else {
      setTimeout(startConnection, AUTO_START_DELAY_MS);
    }
  </script>
</body>
</html>
